<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose your habits — Life Score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0E1A1C;
    --surface: #16292B;
    --surface-2: #1C3134;
    --line: #ffffff14;
    --line-soft: #ffffff0a;
    --teal: #5FAFA4;
    --teal-dim: #5FAFA422;
    --blue: #7DA3D6;
    --blue-dim: #7DA3D622;
    --rust: #C98368;
    --rust-dim: #C9836822;
    --gray: #7C8B88;
    --gray-dim: #7C8B8822;
    --text: #EEF3F1;
    --text-mute: #93A6A2;
    --text-faint: #93A6A266;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    padding-bottom: 7rem;
  }

  /* ---------- Header ---------- */

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(14, 26, 28, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 1.1rem 1.5rem;
  }

  .header-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.05rem;
  }

  .progress-pill {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-mute);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 0.4rem 0.85rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  .progress-pill b { color: var(--teal); font-weight: 400; }

  /* ---------- Intro ---------- */

  .intro {
    max-width: 700px;
    margin: 0 auto;
    padding: 3rem 1.5rem 2rem;
  }

  .intro h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.7rem, 4vw, 2.3rem);
    max-width: 20ch;
    margin-bottom: 0.85rem;
  }

  .intro p {
    color: var(--text-mute);
    max-width: 52ch;
    font-size: 1rem;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 1.25rem;
    margin-top: 1.5rem;
    font-size: 0.85rem;
    color: var(--text-mute);
  }

  .legend-item { display: flex; align-items: center; gap: 0.5rem; }
  .legend-dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; }
  .dot-keep { background: var(--teal); }
  .dot-start { background: var(--blue); }
  .dot-quit { background: var(--rust); }
  .dot-na { background: var(--gray); }

  /* ---------- Habit list ---------- */

  .habit-section {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  .category {
    margin-top: 2.75rem;
  }

  .category-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.25rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--line);
  }

  .habit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.1rem 0;
    border-bottom: 1px solid var(--line-soft);
  }

  .habit-name {
    font-size: 0.98rem;
    color: var(--text);
    flex: 1;
    min-width: 0;
  }

  .habit-controls {
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
  }

  .habit-btn.na-btn { color: var(--text-faint); }

  .habit-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.5rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .habit-btn:hover { border-color: var(--text-mute); color: var(--text-mute); }

  .habit-btn.active-keep { background: var(--teal-dim); border-color: var(--teal); color: var(--teal); }
  .habit-btn.active-start { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); }
  .habit-btn.active-quit { background: var(--rust-dim); border-color: var(--rust); color: var(--rust); }
  .habit-btn.active-na { background: var(--gray-dim); border-color: var(--gray); color: var(--gray); }

  /* ---------- Sticky footer CTA ---------- */

  .footer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(14, 26, 28, 0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 1rem 1.5rem;
    z-index: 10;
  }

  .footer-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .footer-note {
    font-size: 0.85rem;
    color: var(--text-mute);
  }

  .footer-note b { color: var(--text); font-weight: 500; }

  .continue-btn {
    background: var(--teal);
    color: #082220;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.98rem;
    padding: 0.85rem 1.6rem;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .continue-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .continue-btn:not(:disabled):hover { transform: translateY(-2px); }

  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  @media (max-width: 520px) {
    .habit-row { flex-direction: column; align-items: flex-start; gap: 0.7rem; }
    .habit-controls {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .habit-btn { text-align: center; padding: 0.6rem 0.5rem; }
    .footer-note { display: none; }
  }
</style>
</head>
<body>

  <header>
    <div class="header-inner">
      <span class="brand">Life Score</span>
      <span class="progress-pill"><b id="selCount">0</b> / 23 marked</span>
    </div>
  </header>

  <section class="intro">
    <h1>Which habits are part of your life?</h1>
    <p>Mark each one as something you're keeping up, starting fresh, or ready to quit — or as not for you. There's no wrong answer.</p>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot dot-keep"></span>Keep doing</span>
      <span class="legend-item"><span class="legend-dot dot-start"></span>Start new</span>
      <span class="legend-item"><span class="legend-dot dot-quit"></span>Quit</span>
      <span class="legend-item"><span class="legend-dot dot-na"></span>Not for me</span>
    </div>
  </section>

  <section class="habit-section" id="habitSection"></section>

  <div class="footer-bar">
    <div class="footer-inner">
      <span class="footer-note"><b id="selCount2">0</b> habits marked</span>
      <button class="continue-btn" id="continueBtn" onclick="continueFlow()">Continue</button>
    </div>
  </div>

<script>
  const categories = [
    {
      name: "Sleep & rest",
      habits: ["Sleep 7+ hours a night", "Keep a consistent bedtime", "No phone in bed before sleep"]
    },
    {
      name: "Movement",
      habits: ["Take a daily walk", "Strength training", "Stretching or mobility work", "Regular cardio workout"]
    },
    {
      name: "Nutrition",
      habits: ["Drink enough water", "Eat vegetables daily", "Limit added sugar", "Plan meals ahead", "Limit alcohol"]
    },
    {
      name: "Mind & focus",
      habits: ["Meditate or breathe intentionally", "Journal regularly", "Read for pleasure or growth", "Protect deep-focus work blocks", "Limit social media scrolling"]
    },
    {
      name: "Money",
      habits: ["Track your spending", "Save part of every paycheck", "Avoid impulse purchases"]
    },
    {
      name: "Connection",
      habits: ["Call family or close friends", "Spend time outdoors", "Give a partner or friend real, undistracted time"]
    }
  ];

  const state = {}; // habitName -> 'keep' | 'start' | 'quit'
  const section = document.getElementById('habitSection');

  categories.forEach(cat => {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    const title = document.createElement('p');
    title.className = 'category-title';
    title.textContent = cat.name;
    catDiv.appendChild(title);

    cat.habits.forEach(habit => {
      const row = document.createElement('div');
      row.className = 'habit-row';

      const nameEl = document.createElement('span');
      nameEl.className = 'habit-name';
      nameEl.textContent = habit;

      const controls = document.createElement('div');
      controls.className = 'habit-controls';

      const options = [
        { key: 'keep', label: 'Keep' },
        { key: 'start', label: 'Start' },
        { key: 'quit', label: 'Quit' },
        { key: 'na', label: 'Not for me' }
      ];

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'habit-btn' + (opt.key === 'na' ? ' na-btn' : '');
        btn.textContent = opt.label;
        btn.setAttribute('data-habit', habit);
        btn.setAttribute('data-choice', opt.key);
        btn.onclick = () => toggleChoice(habit, opt.key, controls);
        controls.appendChild(btn);
      });

      row.appendChild(nameEl);
      row.appendChild(controls);
      catDiv.appendChild(row);
    });

    section.appendChild(catDiv);
  });

  function toggleChoice(habit, choice, controlsEl) {
    const current = state[habit];
    if (current === choice) {
      delete state[habit]; // deselect if clicking the same one again
    } else {
      state[habit] = choice;
    }

    [...controlsEl.children].forEach(btn => {
      btn.classList.remove('active-keep', 'active-start', 'active-quit', 'active-na');
      const c = btn.getAttribute('data-choice');
      if (state[habit] === c) btn.classList.add('active-' + c);
    });

    updateCount();
  }

  function updateCount() {
    const count = Object.keys(state).length;
    document.getElementById('selCount').textContent = count;
    document.getElementById('selCount2').textContent = count;
    document.getElementById('continueBtn').disabled = count === 0;
  }

  function continueFlow() {
    sessionStorage.setItem('lifeScoreHabits', JSON.stringify(state));
    window.location.href = 'results.html';
  }
</script>

</body>
</html>
