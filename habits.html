<style>
  :root {
    --ink: #0E1A1C;
    --surface: #16292B;
    --surface-2: #1C3134;
    --line: #ffffff14;
    --line-soft: #ffffff0a;
    --teal: #5FAFA4;
    --teal-dim: #5FAFA422;
    --quit: #FF6452;
    --quit-dim: #FF645222;
    --quit-glow: #FF645244;
    --text: #EEF3F1;
    --text-mute: #93A6A2;
    --text-faint: #93A6A266;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    padding-bottom: 7rem;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(14, 26, 28, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 1.1rem 1.5rem;
  }

  .header-inner {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.05rem;
    text-decoration: none;
    color: var(--text);
  }

  .progress-pill {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-mute);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 0.4rem 0.85rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  .progress-pill b { color: var(--teal); font-weight: 400; }

  .intro {
    max-width: 700px;
    margin: 0 auto;
    padding: 3rem 1.5rem 1rem;
  }

  .intro h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.7rem, 4vw, 2.3rem);
    max-width: 22ch;
    margin-bottom: 0.85rem;
  }

  .intro p {
    color: var(--text-mute);
    max-width: 54ch;
    font-size: 1rem;
  }

  .habit-section {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  .category {
    margin-top: 2.5rem;
  }

  .category-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .habit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.1rem 0;
  }

  .habit-name {
    font-size: 1rem;
    color: var(--text);
    flex: 1;
    min-width: 0;
  }

  .quit-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.65rem 1.1rem;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .quit-btn:hover {
    border-color: var(--teal);
    color: var(--teal);
  }

  .quit-btn.active {
    background: var(--teal);
    border-color: var(--teal);
    color: #082220;
    box-shadow: 0 4px 18px -4px var(--teal-dim);
  }

  .footer-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(14, 26, 28, 0.95);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 1rem 1.5rem;
    z-index: 10;
  }

  .footer-inner {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .footer-note {
    font-size: 0.85rem;
    color: var(--text-mute);
  }

  .footer-note b { color: var(--text); font-weight: 500; }

  .continue-btn {
    background: var(--teal);
    color: #082220;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.98rem;
    padding: 0.85rem 1.6rem;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.2s ease;
  }

  .continue-btn:not(:disabled):hover { transform: translateY(-2px); }

  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  @media (max-width: 480px) {
    .habit-row { gap: 0.75rem; }
    .quit-btn { font-size: 0.78rem; padding: 0.6rem 0.85rem; }
    .footer-note { display: none; }
  }
</style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a class="brand" href="index.html">Life Score</a>
      <span class="progress-pill"><b id="selCount">0</b> / 15 today</span>
    </div>
  </header>

  <section class="intro">
    <h1>What happened in the last 24 hours?</h1>
    <p>Mark anything below that showed up for you today. Come back tomorrow — or in a few days, or next week — and check in again to see how it's changing.</p>
  </section>

  <section class="habit-section" id="habitSection"></section>

  <div class="footer-bar">
    <div class="footer-inner">
      <span class="footer-note"><b id="selCount2">0</b> things marked</span>
      <button class="continue-btn" id="continueBtn" onclick="continueFlow()">See today's score</button>
    </div>
  </div>

<script>
  const categories = [
    {
      name: "Mental Obsessions",
      emoji: "🧠",
      habits: [
        "Overthinking",
        "Obsessing Over Others",
        "Attachment to Possessions",
        "Dwelling on the Past",
        "Worrying About the Future",
        "Negative Feelings"
      ]
    },
    {
      name: "Uncontrolled Behaviors",
      emoji: "🔴",
      habits: [
        "Impulsive Behavior",
        "Laziness & Procrastination",
        "Overeating",
        "Unhealthy Eating & Drinking",
        "Alcohol, Smoking & Drugs",
        "Pornography",
        "Social Media & Gaming Addiction",
        "Gambling",
        "Unnecessary Spending"
      ]
    }
  ];

  const TOTAL_HABITS = categories.reduce((sum, c) => sum + c.habits.length, 0);
  const state = new Set(); // habit names marked "I have this and want to quit"
  const section = document.getElementById('habitSection');

  categories.forEach(cat => {
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    const title = document.createElement('p');
    title.className = 'category-title';
    title.innerHTML = `<span>${cat.emoji}</span><span>${cat.name}</span>`;
    catDiv.appendChild(title);

    cat.habits.forEach(habit => {
      const row = document.createElement('div');
      row.className = 'habit-row';

      const nameEl = document.createElement('span');
      nameEl.className = 'habit-name';
      nameEl.textContent = habit;

      const btn = document.createElement('button');
      btn.className = 'quit-btn';
      btn.textContent = 'Yes, in the last 24h';
      btn.onclick = () => toggleHabit(habit, btn);

      row.appendChild(nameEl);
      row.appendChild(btn);
      catDiv.appendChild(row);
    });

    section.appendChild(catDiv);
  });

  function toggleHabit(habit, btnEl) {
    if (state.has(habit)) {
      state.delete(habit);
      btnEl.classList.remove('active');
    } else {
      state.add(habit);
      btnEl.classList.add('active');
    }
    updateCount();
  }

  function updateCount() {
    document.getElementById('selCount').textContent = state.size;
    document.getElementById('selCount2').textContent = state.size;
  }

  function continueFlow() {
    const selections = {};
    state.forEach(name => { selections[name] = 'quit'; });
    sessionStorage.setItem('lifeScoreHabits', JSON.stringify(selections));
    sessionStorage.setItem('lifeScoreTotalHabits', String(TOTAL_HABITS));
    if (typeof fbq !== 'undefined') fbq('trackCustom', 'HabitsSelected', { count: state.size });
    if (typeof ttq !== 'undefined') ttq.track('HabitsSelected', { count: state.size });
    window.location.href = 'results.html';
  }
</script>

</body>
</html>
