<style>
  :root {
    --ink: #0E1A1C;
    --surface: #16292B;
    --line: #ffffff14;
    --teal: #5FAFA4;
    --teal-dim: #5FAFA422;
    --rust: #C98368;
    --text: #EEF3F1;
    --text-mute: #93A6A2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    position: relative;
  }

  .hidden { display: none; }

  header { padding: 1.1rem 1.5rem; }
  .header-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }

  .header-auth-btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 0.5rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-mute);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .header-auth-btn:hover { border-color: var(--teal); color: var(--teal); }
  .header-auth-btn.logout { border-color: var(--rust); color: var(--rust); }
  .header-auth-btn.logout:hover { background: #C9836822; }
  .brand { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.05rem; text-decoration: none; color: var(--text); }

  .wrap { max-width: 640px; margin: 0 auto; padding: 4rem 1.5rem 5rem; }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    margin-bottom: 0.5rem;
  }

  .sub { color: var(--text-mute); margin-bottom: 2.5rem; }
  .sub .nickname { color: var(--text); font-weight: 600; }

  /* ---------- Login form ---------- */

  .login-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 2rem;
  }

  .login-box p { color: var(--text-mute); margin-bottom: 1.5rem; }

  .login-form { display: flex; flex-direction: column; gap: 0.75rem; }

  .login-form input {
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    padding: 0.85rem 1.1rem;
  }

  .btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0.85rem 1.5rem;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: var(--teal);
    color: #082220;
    align-self: flex-start;
    transition: transform 0.2s ease;
  }

  .btn:hover { transform: translateY(-1px); }

  .auth-msg { font-size: 0.85rem; color: var(--rust); }
  .auth-msg.success { color: var(--teal); }

  .link-btn {
    background: none;
    border: none;
    color: var(--text-mute);
    font-size: 0.85rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 0.4rem 0;
    align-self: flex-start;
  }

  .link-btn:hover { color: var(--teal); }

  /* ---------- Report list ---------- */

  .report-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }

  .report-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .report-date { font-family: 'Space Mono', monospace; font-size: 0.85rem; color: var(--text-mute); }

  .report-nums { display: flex; flex-wrap: wrap; gap: 1.25rem; margin-bottom: 0.75rem; }

  .report-nums .num { font-family: 'Space Mono', monospace; font-size: 1.3rem; font-weight: 700; color: var(--teal); }
  .report-nums .lbl { font-size: 0.72rem; color: var(--text-mute); }

  .report-bottleneck { font-size: 0.9rem; color: var(--text-mute); }
  .report-bottleneck b { color: var(--text); font-weight: 500; }

  .trend-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 1.75rem;
    margin-bottom: 2rem;
  }

  .trend-headline {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
  }

  .trend-sub { color: var(--text-mute); font-size: 0.9rem; margin-bottom: 1.5rem; }

  .trend-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  .trend-chip {
    font-size: 0.85rem;
    color: var(--text-mute);
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.4rem 0.75rem;
  }

  .trend-chip b { font-family: 'Space Mono', monospace; font-weight: 700; }

  .chart {
    display: flex;
    align-items: flex-end;
    gap: 0.5rem;
    height: 140px;
    overflow-x: auto;
    padding-bottom: 0.25rem;
  }

  .bar-col {
    flex: 1;
    min-width: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
    gap: 0.4rem;
    position: relative;
    cursor: pointer;
    border-radius: 8px;
    padding-top: 1.5rem;
    transition: background 0.15s ease;
  }

  .bar-col:hover, .bar-col.active { background: #1C3134; }

  .bar-tooltip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(-4px);
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.45rem 0.7rem;
    font-size: 0.75rem;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 5;
    text-align: center;
  }

  .bar-tooltip b { color: var(--teal); font-family: 'Space Mono', monospace; }
  .bar-col:hover .bar-tooltip { opacity: 1; }

  .bar-value {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-mute);
  }

  .bar-fill {
    width: 100%;
    max-width: 28px;
    background: linear-gradient(to top, var(--teal), #5FAFA466);
    border-radius: 6px 6px 2px 2px;
  }

  .bar-col.active .bar-fill { background: linear-gradient(to top, var(--teal), #8FCFC4); }

  .bar-day {
    font-size: 0.68rem;
    color: var(--text-mute);
    margin-top: 0.2rem;
  }

  .day-detail {
    display: none;
    background: var(--ink);
    border: 1px solid var(--teal);
    border-radius: 12px;
    padding: 1.1rem 1.25rem;
    margin-top: 1.25rem;
  }

  .day-detail.show { display: block; }

  .day-detail-date {
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    color: var(--teal);
    margin-bottom: 0.6rem;
  }

  .day-detail-score { font-size: 0.92rem; margin-bottom: 0.6rem; }
  .day-detail-score b { font-family: 'Space Mono', monospace; color: var(--teal); }

  .day-detail-items { display: flex; flex-wrap: wrap; gap: 0.5rem; }

  .day-detail-freedoms {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.6rem;
    margin-bottom: 1rem;
  }

  .freedom-stat {
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.7rem 0.4rem;
    text-align: center;
  }

  .freedom-stat-emoji { display: block; font-size: 1.15rem; margin-bottom: 0.2rem; }
  .freedom-stat-lbl { display: block; font-size: 0.62rem; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.25rem; }
  .freedom-stat-val { display: block; font-family: 'Space Mono', monospace; font-size: 1.15rem; font-weight: 700; }

  @media (max-width: 420px) {
    .day-detail-freedoms { grid-template-columns: repeat(2, 1fr); }
  }

  .day-detail-tag {
    font-size: 0.78rem;
    color: var(--text-mute);
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
  }

  .day-detail-empty { font-size: 0.85rem; color: var(--text-mute); }

  .day-detail.win {
    border-color: var(--teal);
    box-shadow: 0 0 30px -8px var(--teal-dim);
  }

  .day-detail-win {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.05rem;
    color: var(--teal);
  }

  .report-card.win {
    border-color: var(--teal);
    box-shadow: 0 0 24px -8px var(--teal-dim);
  }

  .bg-texture {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('bg-pattern.png');
    background-repeat: repeat;
    background-size: 420px 420px;
    opacity: 0.5;
    pointer-events: none;
  }

  body > * { position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="bg-texture"></div>

  <header>
    <div class="header-inner">
      <a class="brand" href="index.html">Life Score</a>
      <button class="header-auth-btn" id="headerAuthBtn" onclick="headerAuthAction()"></button>
    </div>
  </header>

  <div class="wrap">

    <div id="loginView">
      <h1>Log in to see your reports</h1>
      <p class="sub">Enter the email and password you used when you saved a check-in.</p>
      <div class="login-box">
        <div class="login-form">
          <input type="email" id="email" placeholder="you@email.com" autocomplete="email">
          <input type="password" id="password" placeholder="Password">
          <button class="btn" onclick="doLogin()">Log in</button>
          <p class="auth-msg" id="loginMsg"></p>
          <button class="link-btn" onclick="doForgotPassword()">Forgot your password?</button>
        </div>
      </div>
    </div>

    <div id="reportsView" class="hidden">
      <h1>Your trend</h1>
      <div id="trendBox"></div>
      <div id="reportList"></div>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="lifescore.js"></script>
<script>
  async function doLogin() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const msgEl = document.getElementById('loginMsg');
    const loginBtn = document.querySelector('.login-form .btn');

    if (!email || !password) {
      msgEl.textContent = 'Enter your email and password.';
      msgEl.className = 'auth-msg';
      return;
    }

    loginBtn.disabled = true;
    msgEl.textContent = 'Logging in...';
    msgEl.className = 'auth-msg';

    try {
      if (typeof supabase === 'undefined' || !supabaseClient) {
        throw new Error('Supabase library did not load — check your internet connection and reload the page.');
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) throw new Error("That email and password don't match an account.");

      await loadAndShowReports(data.user.email, data.user.id);
    } catch (err) {
      msgEl.textContent = err.message;
      msgEl.className = 'auth-msg';
      loginBtn.disabled = false;
    }
  }

  async function doForgotPassword() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const msgEl = document.getElementById('loginMsg');

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msgEl.textContent = 'Enter your email above first, then tap this again.';
      msgEl.className = 'auth-msg';
      return;
    }

    msgEl.textContent = 'Sending reset link...';
    msgEl.className = 'auth-msg';

    try {
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset-password.html'
      });
      if (error) throw new Error(error.message);
      msgEl.textContent = 'Check your email for a link to reset your password.';
      msgEl.className = 'auth-msg success';
    } catch (err) {
      msgEl.textContent = err.message;
      msgEl.className = 'auth-msg';
    }
  }

  async function loadAndShowReports(email, userId) {
    const { data: reports, error } = await supabaseClient
      .from('reports')
      .select('*')
      .eq('user_id', userId)
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('loginMsg').textContent = 'Could not load reports: ' + error.message;
      return;
    }

    showReports(email, reports);
  }

  // Safety net: if this account has old rows from before check-ins were
  // capped at one per day, only keep the most recent row per calendar date.
  function dedupeByDay(reports) {
    const byDay = new Map();
    reports.forEach(r => {
      const dayKey = new Date(r.created_at).toLocaleDateString('en-CA'); // YYYY-MM-DD, local time
      const existing = byDay.get(dayKey);
      if (!existing || new Date(r.created_at) > new Date(existing.created_at)) {
        byDay.set(dayKey, r);
      }
    });
    return [...byDay.values()];
  }

  function showReports(email, reports) {
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('reportsView').classList.remove('hidden');
    setHeaderAuth(true);

    const sorted = dedupeByDay(reports).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    renderTrend(sorted);
    renderList(sorted);
  }

  function setHeaderAuth(loggedIn) {
    const btn = document.getElementById('headerAuthBtn');
    if (loggedIn) {
      btn.textContent = 'Log out';
      btn.className = 'header-auth-btn logout';
    } else {
      btn.textContent = 'Log in';
      btn.className = 'header-auth-btn';
    }
  }

  async function headerAuthAction() {
    const btn = document.getElementById('headerAuthBtn');
    if (btn.classList.contains('logout')) {
      await supabaseClient.auth.signOut();
      document.getElementById('reportsView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
      setHeaderAuth(false);
    } else {
      document.getElementById('email')?.focus();
    }
  }

  function habitNamesOf(report) {
    return (report.habits || []).map(h => h.name);
  }

  function totalDaysOf(r) {
    const vals = [r.mental_days, r.physical_days, r.financial_days, r.temporal_days];
    if (vals.some(v => v === null || v === undefined)) return null;
    return vals.reduce((a, b) => a + b, 0);
  }

  function renderTrend(sorted) {
    const box = document.getElementById('trendBox');

    if (sorted.length < 2) {
      box.innerHTML = `
        <div class="trend-box">
          <p class="trend-headline">Check in again to see your trend</p>
          <p class="trend-sub" style="margin-bottom:0;">Once you have a second check-in, we'll show you a chart here — hover or tap any day to see what it looked like.</p>
        </div>`;
      return;
    }

    const latest = sorted[0];
    const prev = sorted[1];
    const latestTotal = totalDaysOf(latest);
    const prevTotal = totalDaysOf(prev);
    const haveDelta = latestTotal !== null && prevTotal !== null;

    const FREEDOM_KEYS = [
      { key: 'mental_days', emoji: '🧠', label: 'Mental' },
      { key: 'physical_days', emoji: '💪', label: 'Physical' },
      { key: 'financial_days', emoji: '💰', label: 'Financial' },
      { key: 'temporal_days', emoji: '⏳', label: 'Time' }
    ];

    const deltaChips = haveDelta ? FREEDOM_KEYS.map(f => {
      const d = prev[f.key] - latest[f.key];
      const color = d > 0 ? 'var(--teal)' : d < 0 ? '#C98368' : 'var(--text-mute)';
      const text = d > 0 ? `−${d}d` : d < 0 ? `+${Math.abs(d)}d` : '±0';
      return `<span class="trend-chip">${f.emoji} <b style="color:${color}">${text}</b></span>`;
    }).join('') : '';

    box.innerHTML = `
      <div class="trend-box">
        <p class="trend-headline">Since your last check-in</p>
        ${haveDelta
          ? `<div class="trend-chips">${deltaChips}</div>`
          : `<p class="trend-sub" style="margin-bottom:0.5rem;">Not enough data yet to compare.</p>`}
        <p class="trend-sub">Hover or tap a day below to see what was marked that day.</p>
        <div class="chart" id="historyChart"></div>
        <div class="day-detail" id="historyDayDetail"></div>
      </div>`;

    // Chart reads left-to-right chronologically (oldest to newest); cap at the
    // most recent 14 check-ins so the chart stays readable.
    const chronological = [...sorted].reverse().slice(-14);

    renderBarChart(
      document.getElementById('historyChart'),
      chronological,
      document.getElementById('historyDayDetail'),
      r => new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    );
  }

  function renderBarChart(containerEl, data, detailEl, dateLabelFn) {
    containerEl.innerHTML = '';
    const maxTotal = 360; // 4 freedoms × 90 days max

    data.forEach((r, i) => {
      const total = totalDaysOf(r);
      const col = document.createElement('div');
      col.className = 'bar-col' + (i === data.length - 1 ? ' active' : '');

      const tooltip = document.createElement('div');
      tooltip.className = 'bar-tooltip';
      tooltip.innerHTML = total === null
        ? `${dateLabelFn(r)}<br>no freedom data`
        : `${dateLabelFn(r)}<br><b>${total}</b> days total`;

      const value = document.createElement('span');
      value.className = 'bar-value';
      value.textContent = total === null ? '—' : total;

      const bar = document.createElement('div');
      bar.className = 'bar-fill';
      const heightPct = total === null ? 6 : Math.max(6, 100 - Math.round((total / maxTotal) * 100));
      bar.style.height = heightPct + '%';
      if (total !== null) {
        const barColor = freedomColorScale(total, maxTotal);
        bar.style.background = `linear-gradient(to top, ${barColor}, ${barColor}99)`;
        value.style.color = barColor;
      }

      const dayLbl = document.createElement('span');
      dayLbl.className = 'bar-day';
      dayLbl.textContent = new Date(r.created_at || Date.now()).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

      col.appendChild(tooltip);
      col.appendChild(value);
      col.appendChild(bar);
      col.appendChild(dayLbl);

      col.onclick = () => {
        [...containerEl.children].forEach(c => c.classList.remove('active'));
        col.classList.add('active');
        showDayDetail(detailEl, r, dateLabelFn(r));
      };

      containerEl.appendChild(col);
    });

    // Show the most recent day's detail by default.
    if (data.length) {
      showDayDetail(detailEl, data[data.length - 1], dateLabelFn(data[data.length - 1]));
    }
  }

  function showDayDetail(detailEl, r, dateLabel) {
    const items = habitNamesOf(r);
    const total = totalDaysOf(r);

    // Legacy check-ins saved before freedom tracking existed — no
    // meaningful numbers to show, so say that plainly instead of a
    // confusing row of dashes.
    if (total === null) {
      detailEl.className = 'day-detail show';
      detailEl.innerHTML = `
        <p class="day-detail-date">${dateLabel}</p>
        <p class="day-detail-empty">This check-in was saved before freedom tracking started — no numbers for this day.</p>
      `;
      return;
    }

    if (total === 0) {
      // Nothing marked at all — a full win, so make it feel like one.
      detailEl.className = 'day-detail show win';
      detailEl.innerHTML = `
        <p class="day-detail-date">${dateLabel}</p>
        <p class="day-detail-win">🎉 Completely free — nothing was holding you back.</p>
      `;
      return;
    }

    const itemsHtml = items.length
      ? `<div class="day-detail-items">${items.map(name => `<span class="day-detail-tag">${name}</span>`).join('')}</div>`
      : '';
    const freedomHtml = `
      <div class="day-detail-freedoms">
        <div class="freedom-stat"><span class="freedom-stat-emoji">🧠</span><span class="freedom-stat-lbl">Mental</span><span class="freedom-stat-val" style="color:${freedomColorScale(r.mental_days, 90)}">${r.mental_days}d</span></div>
        <div class="freedom-stat"><span class="freedom-stat-emoji">💪</span><span class="freedom-stat-lbl">Physical</span><span class="freedom-stat-val" style="color:${freedomColorScale(r.physical_days, 90)}">${r.physical_days}d</span></div>
        <div class="freedom-stat"><span class="freedom-stat-emoji">💰</span><span class="freedom-stat-lbl">Financial</span><span class="freedom-stat-val" style="color:${freedomColorScale(r.financial_days, 90)}">${r.financial_days}d</span></div>
        <div class="freedom-stat"><span class="freedom-stat-emoji">⏳</span><span class="freedom-stat-lbl">Time</span><span class="freedom-stat-val" style="color:${freedomColorScale(r.temporal_days, 90)}">${r.temporal_days}d</span></div>
      </div>`;

    detailEl.className = 'day-detail show';
    detailEl.innerHTML = `
      <p class="day-detail-date">${dateLabel}</p>
      ${freedomHtml}
      ${itemsHtml}
    `;
  }

  function renderList(sorted) {
    const listEl = document.getElementById('reportList');
    listEl.innerHTML = '';

    if (sorted.length === 0) {
      listEl.innerHTML = '<p style="color:var(--text-mute);">No check-ins saved yet.</p>';
      return;
    }

    sorted.forEach(r => {
      const card = document.createElement('div');
      const dateStr = new Date(r.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      const total = totalDaysOf(r);

      if (total === null) {
        card.className = 'report-card';
        card.innerHTML = `
          <div class="report-top"><span class="report-date">${dateStr}</span></div>
          <p class="day-detail-empty" style="margin:0;">Saved before freedom tracking started.</p>
        `;
        listEl.appendChild(card);
        return;
      }

      if (total === 0) {
        card.className = 'report-card win';
        card.innerHTML = `
          <div class="report-top"><span class="report-date">${dateStr}</span></div>
          <p class="day-detail-win" style="margin:0;">🎉 Completely free that day.</p>
        `;
        listEl.appendChild(card);
        return;
      }

      card.className = 'report-card';
      card.innerHTML = `
        <div class="report-top">
          <span class="report-date">${dateStr}</span>
        </div>
        <div class="report-nums">
          <div><div class="num" style="color:${freedomColorScale(r.mental_days, 90)}">${r.mental_days}</div><div class="lbl">🧠 mental</div></div>
          <div><div class="num" style="color:${freedomColorScale(r.physical_days, 90)}">${r.physical_days}</div><div class="lbl">💪 physical</div></div>
          <div><div class="num" style="color:${freedomColorScale(r.financial_days, 90)}">${r.financial_days}</div><div class="lbl">💰 financial</div></div>
          <div><div class="num" style="color:${freedomColorScale(r.temporal_days, 90)}">${r.temporal_days}</div><div class="lbl">⏳ time</div></div>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  // If a session already exists (e.g. just came from saving a check-in), skip straight to it.
  setHeaderAuth(false);
  (async () => {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
      await loadAndShowReports(data.session.user.email, data.session.user.id);
    }
  })();
</script>

</body>
</html>
